server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required so the proxy_pass directives below can
    # re-resolve upstream container names at request time (via variables)
    # instead of caching a single IP at nginx startup. Without this, a
    # recreated upstream container gets a new IP and every proxied request
    # 502s until nginx is manually reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health of the frontend itself
    location = /frontend-health {
        access_log off;
        return 200 "ok\n";
    }

    # Proxy REST API to the backend
    location /api/ {
        set                $backend "red-team-backend:8000";
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy /health too (for parity)
    location = /health {
        set                $backend "red-team-backend:8000";
        proxy_pass         http://$backend/health;
        proxy_set_header   Host $host;
    }

    # Proxy the control API (attense-app: auth, rooms). /api/ above goes to the
    # red-team backend, so the auth backend needs its own prefix. Same-origin so
    # the portal-issued session token in localStorage reaches /api/auth/me here.
    # /control-api/api/auth/me → http://attense-app:8020/api/auth/me
    location /control-api/ {
        set                $control_api "attense-app:8020";
        rewrite            ^/control-api/(.*)$ /$1 break;
        proxy_pass         http://$control_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy vulnerable target pages. Browser → /target/auth/login →
    # http://target-agent/auth/login. X-Forwarded-Prefix tells the Flask app
    # to emit URLs prefixed with /target/ so forms, links and redirects stay
    # inside the iframe.
    location /target/ {
        set                $target_upstream "target-agent";
        rewrite            ^/target/(.*)$ /$1 break;
        proxy_pass         http://$target_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /target;
        proxy_read_timeout 60s;
        # Local lab only — strip any frame-blocking headers so the iframe
        # in the LabBrowser can render the page.
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
    }

    # Operator-mode parallel target. Same UI (templates), DIFFERENT backend
    # logic — harder credentials, partial sanitization, etc. The iframe in
    # operator mode loads /target-op/... ; this proxy rewrites to /op/... on
    # target-agent where the routes_op blueprints are mounted.
    location /target-op/ {
        set                $target_upstream "target-agent";
        rewrite            ^/target-op/(.*)$ /op/$1 break;
        proxy_pass         http://$target_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /target-op;
        proxy_read_timeout 60s;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
    }


    # Operator-mode browser-through-ZAP. The lab browser loads /target-zap/...
    # which we hand to the red-team backend's /zap-browse/ reverse proxy; that
    # forwards each request to http://target-agent/op/... THROUGH OWASP ZAP, so
    # ordinary clicks, form posts and navigation are recorded in ZAP history
    # (like Burp Proxy History). Strictly local — the backend only ever targets
    # target-agent. Repeater/Fuzzer are unaffected (separate /api routes).
    location /target-zap/ {
        set                $backend "red-team-backend:8000";
        rewrite            ^/target-zap/(.*)$ /zap-browse/$1 break;
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Local lab only — strip frame-blocking headers so the iframe renders.
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
    }

    # WebSocket shell — requires Upgrade headers
    location /ws/ {
        set                 $backend "red-team-backend:8000";
        proxy_pass          http://$backend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # SPA fallback. index.html must never be cached by the browser, otherwise
    # a stale copy keeps pointing at an old hashed JS bundle and code changes
    # never appear until a manual hard-refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Long cache for hashed assets
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
