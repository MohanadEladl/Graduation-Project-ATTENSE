server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so proxy_pass re-resolves attense-app at request
    # time (via a variable) instead of caching a single IP at nginx startup.
    # Without this, a recreated attense-app gets a new IP and every proxied
    # request 502s until this frontend is manually reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /frontend-health {
        access_log off;
        return 200 "ok\n";
    }

    # blue-login.html/blue-register.html/red-register.html POST here with a
    # relative path (expecting same-origin proxying, like blue-team-frontend
    # does for its own login/room calls). Without this location the request
    # falls through to the SPA catch-all below, which nginx 405s on POST
    # (try_files rejects non-GET/HEAD methods on its static-file fallback).
    location /api/ {
        set                $app_api "attense-app:8020";
        proxy_pass         http://$app_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|ico|webp|avif|glb|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
